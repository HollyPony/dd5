<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Character</title>
  <!-- External lib -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <!-- Inner lib -->
  <link rel="stylesheet" href="index.css" />
</head>

<body translate="no">
  <div class="d-flex flex-nowrap">
    <main class="container">
      <form>
        <div class="d-flex flex-row mt-2">
          <div class="w-100 p-2 border common-informations">
            <div class="d-flex">
              <div class="w-100 charName">
                <input name="charName" class="form-control border-0 border-bottom rounded-0 px-0"
                  placeholder="Thoradin Fireforge" />
                <label for="charName" class="form-text mt-0" data-i18n="charName._label">Character Name</label>
              </div>
            </div>
            <div class="d-flex gap-3 mb-2">
              <div class="w-100 charOrigin">
                <select name="charOrigin" class="form-select border-0 border-bottom rounded-0 p-0"></select>
                <label for="charOrigin" class="form-text mt-0" data-i18n="origins._label">Origin</label>
              </div>
              <div class="w-100 charClass">
                <select name="charClass" class="form-select border-0 border-bottom rounded-0 p-0"></select>
                <label for="charClass" class="form-text mt-0" data-i18n="classes._label">Class</label>
              </div>
            </div>
            <div class="d-flex gap-3">
              <div class="w-100 charRace">
                <select name="charRace" class="form-control border-0 border-bottom rounded-0 p-0"></select>
                <label for="charRace" class="form-text" data-i18n="races._label">Race</label>
              </div>
              <div class="w-100 charSubClass">
                <select name="charSubClass" class="form-select border-0 border-bottom rounded-0 p-0">
                  <option>Select class first</option>
                </select>
                <label for="charSubClass" class="form-text mt-0" data-i18n="subClasses._label">Subclass</label>
              </div>
            </div>
          </div>

          <div class="d-flex">
            <div class="d-flex flex-column align-items-center border rounded-circle justify-content-center">
              <input name="charLevel" class="form-control text-center" placeholder="0" />
              <label for="charLevel" class="form-text text-center">Level</label>
              <input name="experiencepoints" class="form-control text-center" placeholder="0" />
              <label for="experiencepoints" class="form-text text-center">Experience Points</label>
            </div>
            <div class="d-flex flex-column align-items-center">
              <label for="armorClass" class="form-text text-center title">Armor Class</label>
              <input name="armorClass" class="form-control" placeholder="0" />
              <label for="shield" class="form-text text-center">Shield</label>
              <input name="shield" type="checkbox" class="form-check-input shield-check" />
            </div>
          </div>

          <div class="w-100 d-flex border misc">
            <div class="d-flex flex-column m-2 hit-points">
              <span class="text-center title">Hit Points</span>
              <div class="d-flex align-items-stretch">
                <div class="d-flex flex-column">
                  <input name="currentHp" class="flex-fill form-control border-0 border-bottom rounded-0" />
                  <label for="currentHp" class="form-text">Current</label>
                </div>

                <div class="vr mx-2"></div>

                <div class="d-flex flex-column">
                  <input name="tempHp" class="form-control border-0 border-bottom rounded-0" />
                  <label for="tempHp" class="form-text">Temp</label>
                  <input name="maxHp" class="form-control border-0 border-bottom rounded-0" />
                  <label for="maxHp" class="form-text">Max</label>
                </div>
              </div>
            </div>

            <div class="vr"></div>

            <div class="d-flex flex-column m-2 hit-dice">
              <span class="text-center title">Hit Dice</span>
              <input name="spentHd" class="form-control border-0 border-bottom rounded-0" />
              <label for="spentHd" class="form-text">Spent</label>
              <input name="maxHd" class="form-control border-0 border-bottom rounded-0" />
              <label for="maxHd" class="form-text">Max</label>
            </div>

            <div class="vr"></div>

            <div class="m-2 death-saves">
              <span class="text-center title">Death Saves</span>
              <input type="checkbox" class="form-check-input" />
              <input type="checkbox" class="form-check-input" />
              <input type="checkbox" class="form-check-input" />
              <label>Successes</label>
              <input type="checkbox" class="form-check-input" />
              <input type="checkbox" class="form-check-input" />
              <input type="checkbox" class="form-check-input" />
              <label>Failures</label>
            </div>
          </div>
        </div>

        <hr />

        <div class="row">
          <div class="col-4 d-flex flex-column gap-2">
            <div class="d-flex gap-1">
              <div class="d-flex flex-column gap-2">
                <div class="block proficiency">
                  <label for="proficiencybonus" class="text-center w-100 title"
                    data-i18n="stats.proficiencyBonus">Proficiency Bonus</label>
                  <input disabled name="proficiencybonus" class="form-control p-0 border-0 border-bottom text-center"
                    placeholder="+2">
                </div>
                <div class="ability-card strength">
                  <div class="ability-card-header"></div>
                  <div class="ability-card-content">
                    <label for="strength-score" class="text-center w-100 title"
                      data-i18n="stats.ability.strength">Strength</label>
                    <div class="values">
                      <input disabled name="strength-modifier" class="form-control ability-modifier" placeholder="+0"
                        data-ability="strength" />
                      <input name="strength-score" class="form-control ability-score" placeholder="10"
                        data-ability="strength" />
                    </div>
                    <hr />
                    <div class="form-check">
                      <input disabled name="strength-save-check" type="checkbox" class="form-check-input save-check" />
                      <span class="save-score"></span>
                      <label for="strength-save">Save</label>
                    </div>
                    <hr />
                    <div class="form-check">
                      <input name="athletics" type="checkbox" class="form-check-input skill-check athletics-check" />
                      <span class="skill-score athletics-score"></span>
                      <label for="athletics" data-i18n="stats.skills.athletics">Athletics</label>
                    </div>
                  </div>
                  <div class="ability-card-footer"></div>
                </div>
                <div class="ability-card dexterity">
                  <div class="ability-card-header"></div>
                  <div class="ability-card-content">
                    <label for="dexterity-score" class="text-center w-100 title"
                      data-i18n="stats.ability.dexterity">Dexterity</label>
                    <div class="values">
                      <input disabled name="dexterity-modifier" class="form-control ability-modifier" placeholder="+0"
                        data-ability="dexterity" />
                      <input name="dexterity-score" class="form-control ability-score" placeholder="10"
                        data-ability="dexterity" />
                    </div>
                    <hr />
                    <div class="form-check">
                      <input disabled name="dexterity-save-check" type="checkbox" class="form-check-input save-check" />
                      <span class="save-score"></span>
                      <label for="dexterity-save">Save</label>
                    </div>
                    <hr />
                    <div class="form-check">
                      <input name="acrobatics" type="checkbox" class="form-check-input skill-check acrobatics-check" />
                      <span class="skill-score acrobatics-score"></span>
                      <label for="acrobatics" data-i18n="stats.skills.acrobatics">Acrobatics</label>
                    </div>
                    <div class="form-check">
                      <input name="sleightOfHand" type="checkbox"
                        class="form-check-input skill-check sleightOfHand-check" />
                      <span class="skill-score sleightOfHand-score"></span>
                      <label for="sleightOfHand" data-i18n="stats.skills.sleightOfHand">Sleight of Hand</label>
                    </div>
                    <div class="form-check">
                      <input name="stealth" type="checkbox" class="form-check-input skill-check stealth-check" />
                      <span class="skill-score stealth-score"></span>
                      <label for="stealth" data-i18n="stats.skills.stealth">Stealth</label>
                    </div>
                  </div>
                  <div class="ability-card-footer"></div>
                </div>
                <div class="ability-card constitution">
                  <div class="ability-card-header"></div>
                  <div class="ability-card-content">
                    <label for="constitution-score" class="text-center w-100 title"
                      data-i18n="stats.ability.constitution">Constitution</label>
                    <div class="values">
                      <input disabled name="constitution-modifier" class="form-control ability-modifier"
                        placeholder="+0" data-ability="constitution">
                      <input name="constitution-score" class="form-control ability-score" placeholder="10"
                        data-ability="constitution" />
                    </div>
                    <hr />
                    <div class="form-check">
                      <input disabled name="constitution-save-check" type="checkbox"
                        class="form-check-input save-check" />
                      <span class="save-score"></span>
                      <label for="constitution-save">Save</label>
                    </div>
                  </div>
                  <div class="ability-card-footer"></div>
                </div>
                <div class="block inspiration">
                  <label for="inspiration" class="text-center w-100 title">Inspiration</label>
                  <input name="inspiration" type="checkbox" class="form-check-input inspiration-check" />
                </div>
              </div>
              <div class="d-flex flex-column gap-3">
                <div class="ability-card intelligence">
                  <div class="ability-card-header"></div>
                  <div class="ability-card-content">
                    <label for="intelligence-score" class="text-center w-100 title"
                      data-i18n="stats.ability.intelligence">Intelligence</label>
                    <div class="values">
                      <input disabled name="intelligence-modifier" class="form-control ability-modifier"
                        placeholder="+0" data-ability="intelligence">
                      <input name="intelligence-score" class="form-control ability-score" placeholder="10"
                        data-ability="intelligence" />
                    </div>
                    <hr />
                    <div class="form-check">
                      <input disabled name="intelligence-save-check" type="checkbox"
                        class="form-check-input save-check" />
                      <span class="save-score"></span>
                      <label for="intelligence-save">Save</label>
                    </div>
                    <hr />
                    <div class="form-check">
                      <input name="arcana" type="checkbox" class="form-check-input skill-check arcana-check" />
                      <span class="skill-score arcana-score"></span>
                      <label for="arcana" data-i18n="stats.skills.arcana">Arcana</label>
                    </div>
                    <div class="form-check">
                      <input name="history" type="checkbox" class="form-check-input skill-check history-check" />
                      <span class="skill-score history-score"></span>
                      <label for="history" data-i18n="stats.skills.history">History</label>
                    </div>
                    <div class="form-check">
                      <input name="investigation" type="checkbox"
                        class="form-check-input skill-check investigation-check" />
                      <span class="skill-score investigation-score"></span>
                      <label for="investigation" data-i18n="stats.skills.investigation">Investigation</label>
                    </div>
                    <div class="form-check">
                      <input name="nature" type="checkbox" class="form-check-input skill-check nature-check" />
                      <span class="skill-score nature-score"></span>
                      <label for="nature" data-i18n="stats.skills.nature">Nature</label>
                    </div>
                    <div class="form-check">
                      <input name="religion" type="checkbox" class="form-check-input skill-check religion-check" />
                      <span class="skill-score religion-score"></span>
                      <label for="religion" data-i18n="stats.skills.religion">Religion</label>
                    </div>
                  </div>
                  <div class="ability-card-footer"></div>
                </div>
                <div class="ability-card wisdom">
                  <div class="ability-card-header"></div>
                  <div class="ability-card-content">
                    <label for="wisdom-score" class="text-center w-100 title"
                      data-i18n="stats.ability.wisdom">Wisdom</label>
                    <div class="values">
                      <input disabled name="wisdom-modifier" class="form-control ability-modifier" placeholder="+0"
                        data-ability="wisdom" />
                      <input name="wisdom-score" class="form-control ability-score" placeholder="10"
                        data-ability="wisdom" />
                    </div>
                    <hr />
                    <div class="form-check">
                      <input disabled name="wisdom-save-check" type="checkbox" class="form-check-input save-check" />
                      <span class="save-score"></span>
                      <label for="wisdom-save">Save</label>
                    </div>
                    <hr />
                    <div class="form-check">
                      <input name="animalHandling" type="checkbox"
                        class="form-check-input skill-check animalHandling-check" />
                      <span class="skill-score animalHandling-score"></span>
                      <label for="animalHandling" data-i18n="stats.skills.animalHandling">Animal Handling</label>
                    </div>
                    <div class="form-check">
                      <input name="insight" type="checkbox" class="form-check-input skill-check insight-check" />
                      <span class="skill-score insight-score"></span>
                      <label for="insight" data-i18n="stats.skills.insight">Insight</label>
                    </div>
                    <div class="form-check">
                      <input name="medicine" type="checkbox" class="form-check-input skill-check medicine-check" />
                      <span class="skill-score medicine-score"></span>
                      <label for="medicine" data-i18n="stats.skills.medicine">Medicine</label>
                    </div>
                    <div class="form-check">
                      <input name="perception" type="checkbox" class="form-check-input skill-check perception-check" />
                      <span class="skill-score perception-score"></span>
                      <label for="perception" data-i18n="stats.skills.perception">Perception</label>
                    </div>
                    <div class="form-check">
                      <input name="survival" type="checkbox" class="form-check-input skill-check survival-check" />
                      <span class="skill-score survival-score"></span>
                      <label for="survival" data-i18n="stats.skills.survival">Survival</label>
                    </div>
                  </div>
                  <div class="ability-card-footer"></div>
                </div>
                <div class="ability-card charisma">
                  <div class="ability-card-header"></div>
                  <div class="ability-card-content">
                    <label for="charisma-score" class="text-center w-100 title"
                      data-i18n="stats.ability.charisma">Charisma</label>
                    <div class="values">
                      <input disabled name="charisma-modifier" class="form-control ability-modifier" placeholder="+0"
                        data-ability="charisma" />
                      <input name="charisma-score" class="form-control ability-score" placeholder="10"
                        data-ability="charisma" />
                    </div>
                  </div>
                  <div class="ability-card-content">
                    <div class="form-check">
                      <input disabled name="charisma-save-check" type="checkbox" class="form-check-input save-check" />
                      <span class="save-score"></span>
                      <label for="charisma-save">Save</label>
                    </div>
                  </div>
                  <div class="ability-card-content">
                    <div class="form-check">
                      <input name="deception" type="checkbox" class="form-check-input skill-check deception-check" />
                      <span class="skill-score deception-score"></span>
                      <label for="deception" data-i18n="stats.skills.deception">Deception</label>
                    </div>
                    <div class="form-check">
                      <input name="intimidation" type="checkbox"
                        class="form-check-input skill-check intimidation-check" />
                      <span class="skill-score intimidation-score"></span>
                      <label for="intimidation" data-i18n="stats.skills.intimidation">Intimidation</label>
                    </div>
                    <div class="form-check">
                      <input name="performance" type="checkbox"
                        class="form-check-input skill-check performance-check" />
                      <span class="skill-score performance-score"></span>
                      <label for="performance" data-i18n="stats.skills.performance">Performance</label>
                    </div>
                    <div class="form-check">
                      <input name="persuasion" type="checkbox" class="form-check-input skill-check persuasion-check" />
                      <span class="skill-score persuasion-score"></span>
                      <label for="persuasion" data-i18n="stats.skills.persuasion">Persuasion</label>
                    </div>
                  </div>
                  <div class="ability-card-footer"></div>
                </div>
              </div>
            </div>
            <div class="block">
              <div class="text-center title" data-i18n="stats.trainings.title">entrainement et maitrises</div>
              <div class="armors">
                <span data-i18n="stats.trainings.armor.title"></span>
                <input name="armor-light" type="checkbox" class="form-check-input" />
                <label for="armor-light" data-i18n="stats.trainings.armor.light"></label>
                <input name="armor-medium" type="checkbox" class="form-check-input" />
                <label for="armor-medium" data-i18n="stats.trainings.armor.medium"></label>
                <input name="armor-heavy" type="checkbox" class="form-check-input" />
                <label for="armor-heavy" data-i18n="stats.trainings.armor.heavy"></label>
                <input name="armor-shields" type="checkbox" class="form-check-input" />
                <label for="armor-shields" data-i18n="stats.trainings.armor.shields"></label>
              </div>
              <div class="weapons">
                <span data-i18n="stats.trainings.weapon.title"></span>
              </div>
              <div class="tools">
                <span data-i18n="stats.trainings.tool.title"></span>
              </div>
            </div>
          </div>
          <div class="col d-flex flex-column gap-3">
            <div class="d-flex gap-2 specs">
              <div class="flex-grow-1 flex-basis-0 block">
                <label for="initiative" class="text-center title" data-i18n="specs.initiative">initiative</label>
                <input disabled name="initiative" class="form-control p-0 border-0 border-bottom text-center"
                  placeholder="+2">
              </div>
              <div class="flex-grow-1 flex-basis-0 block">
                <label for="speed" class="text-center title" data-i18n="specs.speed">speed</label>
                <input disabled name="speed" class="form-control p-0 border-0 border-bottom text-center"
                  placeholder="8">
              </div>
              <div class="flex-grow-1 flex-basis-0 block">
                <label for="size" class="text-center title" data-i18n="specs.size">taille</label>
                <input disabled name="size" class="form-control p-0 border-0 border-bottom text-center"
                  placeholder="175 cm">
              </div>
              <div class="flex-grow-1 flex-basis-0 block">
                <label for="passivePerception" class="text-center title" data-i18n="specs.passivePerception">perception
                  passive</label>
                <input disabled name="passivePerception" class="form-control p-0 border-0 border-bottom text-center"
                  placeholder="2">
              </div>
            </div>
            <div class="">
              <div class="block">
                <div class="text-center title" data-i18n="weaponscantrip">armes & sorts mineurs</div>
                <select name="weapons" class="form-select border-0 border-bottom rounded-0 p-0"></select>
              </div>
            </div>
            <div class="">
              <div class="block">
                <div class="text-center title">capacités de classe</div>
              </div>
            </div>
            <div class="d-flex gap-2">
              <div class="flex-grow-1 flex-basis-0 block">
                <div class="text-center title">traits d'epèce</div>
              </div>
              <div class="flex-grow-1 flex-basis-0 block">
                <div class="text-center title">dons</div>
              </div>
            </div>
          </div>
        </div>

        <label for="alignment" class="form-text">Alignment</label>
        <input name="alignment" class="form-control" placeholder="Lawful Good" />
      </form>
    </main>
  </div>
  <!-- External lib -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <!-- Inner lib -->
  <script src="fr.js"></script>
  <script src="i18n.js"></script>
  <script type="module" src="index.js"></script>
</body>

</html>
