<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Character</title>
  <!-- External lib -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <!-- Inner lib -->
  <link rel="stylesheet" href="index.css" />
</head>

<body translate="no">
  <div class="d-flex flex-nowrap">
    <main class="container">
      <form>
        <div class="d-flex flex-row mt-2">
          <div class="w-100 p-2 border common-informations">
            <div class="d-flex">
              <div class="w-100 charName">
                <input name="charName" class="form-control border-0 border-bottom rounded-0 px-0"
                  placeholder="Thoradin Fireforge" />
                <label for="charName" class="form-text mt-0" data-i18n="charName._label">Character Name</label>
              </div>
            </div>
            <div class="d-flex gap-3 mb-2">
              <div class="w-100 charOrigin">
                <select name="charOrigin" class="form-select border-0 border-bottom rounded-0 p-0"></select>
                <label for="charOrigin" class="form-text mt-0" data-i18n="origins._label">Origin</label>
              </div>
              <div class="w-100 charClass">
                <select name="charClass" class="form-select border-0 border-bottom rounded-0 p-0"></select>
                <label for="charClass" class="form-text mt-0" data-i18n="classes._label">Class</label>
              </div>
            </div>
            <div class="d-flex gap-3">
              <div class="w-100 charRace">
                <select name="charRace" class="form-control border-0 border-bottom rounded-0 p-0"></select>
                <label for="charRace" class="form-text" data-i18n="races._label">Race</label>
              </div>
              <div class="w-100 charSubClass">
                <select name="charSubClass" class="form-select border-0 border-bottom rounded-0 p-0">
                  <option>Select class first</option>
                </select>
                <label for="charSubClass" class="form-text mt-0" data-i18n="subClasses._label">Subclass</label>
              </div>
            </div>
          </div>

          <div class="d-flex">
            <div class="d-flex flex-column align-items-center border rounded-circle justify-content-center">
              <input name="charLevel" class="form-control text-center" placeholder="0" />
              <label for="charLevel" class="form-text text-center">Level</label>
              <input name="experiencepoints" class="form-control text-center" placeholder="0" />
              <label for="experiencepoints" class="form-text text-center">Experience Points</label>
            </div>
            <div class="d-flex flex-column align-items-center">
              <label for="armorClass" class="form-text text-center title">Armor Class</label>
              <input name="armorClass" class="form-control" placeholder="0" />
              <label for="shield" class="form-text text-center">Shield</label>
              <input name="shield" type="checkbox" class="form-check-input shield-check" />
            </div>
          </div>

          <div class="w-100 d-flex border misc">
            <div class="d-flex flex-column m-2 hit-points">
              <span class="text-center title">Hit Points</span>
              <div class="d-flex align-items-stretch">
                <div class="d-flex flex-column">
                  <input name="currentHp" class="flex-fill form-control border-0 border-bottom rounded-0" />
                  <label for="currentHp" class="form-text">Current</label>
                </div>

                <div class="vr mx-2"></div>

                <div class="d-flex flex-column">
                  <input name="tempHp" class="form-control border-0 border-bottom rounded-0" />
                  <label for="tempHp" class="form-text">Temp</label>
                  <input name="maxHp" class="form-control border-0 border-bottom rounded-0" />
                  <label for="maxHp" class="form-text">Max</label>
                </div>
              </div>
            </div>

            <div class="vr"></div>

            <div class="d-flex flex-column m-2 hit-dice">
              <span class="text-center title">Hit Dice</span>
              <input name="spentHd" class="form-control border-0 border-bottom rounded-0" />
              <label for="spentHd" class="form-text">Spent</label>
              <input name="maxHd" class="form-control border-0 border-bottom rounded-0" />
              <label for="maxHd" class="form-text">Max</label>
            </div>

            <div class="vr"></div>

            <div class="m-2 death-saves">
              <span class="text-center title">Death Saves</span>
              <input type="checkbox" class="form-check-input" />
              <input type="checkbox" class="form-check-input" />
              <input type="checkbox" class="form-check-input" />
              <label>Successes</label>
              <input type="checkbox" class="form-check-input" />
              <input type="checkbox" class="form-check-input" />
              <input type="checkbox" class="form-check-input" />
              <label>Failures</label>
            </div>
          </div>
        </div>

        <hr />

        <div class="row">
          <div class="col-4 d-flex flex-column gap-2">
            <div class="d-flex gap-1">
              <div class="d-flex flex-column gap-2">
                <div class="block">
                  <label for="proficiencybonus" class="text-center w-100 title">Proficiency Bonus</label>
                  <input disabled name="proficiencybonus" class="form-control p-0 border-0 border-bottom text-center"
                    placeholder="+2">
                </div>
                <div class="ability-card strength">
                  <div class="ability-card-header"></div>
                  <div class="ability-card-content">
                    <label for="strengthscore" class="text-center w-100 title">Strength</label>
                    <div class="values">
                      <input disabled name="strength-modifier" class="form-control rounded-circle ability-modifier"
                        placeholder="+0">
                      <input name="strength-score"
                        class="form-control border-start-0 rounded-0 rounded-end-2 ability-score" placeholder="10"
                        onchange="updateModifier(this, this.value)" />
                    </div>
                    <hr />
                    <div class="form-check">
                      <input disable name="strength-save-check" type="checkbox" class="form-check-input save-check" />
                      <span class="save-score"></span>
                      <label for="strength-save">Save</label>
                    </div>
                    <hr />
                    <div class="form-check">
                      <input name="athletics" type="checkbox" class="form-check-input athletics-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score athletics-score"></span>
                      <label for="Athletics">Athletics</label>
                    </div>
                  </div>
                  <div class="ability-card-footer"></div>
                </div>
                <div class="ability-card dexterity">
                  <div class="ability-card-header"></div>
                  <div class="ability-card-content">
                    <label for="dexterityscore" class="text-center w-100 title">Dexterity</label>
                    <div class="values">
                      <input disabled name="dexterity-modifier" class="form-control ability-modifier" placeholder="+0">
                      <input name="dexterity-score" class="form-control ability-score" placeholder="10"
                        onchange="updateModifier(this, this.value)">
                    </div>
                    <hr />
                    <div class="form-check">
                      <input disable name="dexterity-save-check" type="checkbox" class="form-check-input save-check" />
                      <span class="save-score"></span>
                      <label for="dexterity-save">Save</label>
                    </div>
                    <hr />
                    <div class="form-check">
                      <input name="acrobatics" type="checkbox" class="form-check-input acrobatics-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score acrobatics-score"></span>
                      <label for="Acrobatics">Acrobatics</label>
                    </div>
                    <div class="form-check">
                      <input name="sleightOfHand" type="checkbox" class="form-check-input sleightOfHand-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score sleightOfHand-score"></span>
                      <label for="Sleight of Hand">Sleight of Hand</label>
                    </div>
                    <div class="form-check">
                      <input name="stealth" type="checkbox" class="form-check-input stealth-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score stealth-score"></span>
                      <label for="Stealth">Stealth</label>
                    </div>
                  </div>
                  <div class="ability-card-footer"></div>
                </div>
                <div class="ability-card constitution">
                  <div class="ability-card-header"></div>
                  <div class="ability-card-content">
                    <label for="constitutionscore" class="text-center w-100 title">Constitution</label>
                    <div class="values">
                      <input disabled name="constitution-modifier" class="form-control ability-modifier"
                        placeholder="+0">
                      <input name="constitution-score" class="form-control ability-score" placeholder="10"
                        onchange="updateModifier(this, this.value)">
                    </div>
                    <hr />
                    <div class="form-check">
                      <input disable name="constitution-save-check" type="checkbox"
                        class="form-check-input save-check" />
                      <span class="save-score"></span>
                      <label for="constitution-save">Save</label>
                    </div>
                  </div>
                  <div class="ability-card-footer"></div>
                </div>
                <div class="block">
                  <label for="inspiration" class="text-center w-100 title">Inspiration</label>
                  <input name="inspiration" type="checkbox" class="form-check-input inspiration-check" />
                </div>
              </div>
              <div class="d-flex flex-column gap-3">
                <div class="ability-card intelligence">
                  <div class="ability-card-header"></div>
                  <div class="ability-card-content">
                    <label for="intelligencescore" class="text-center w-100 title">Intelligence</label>
                    <div class="values">
                      <input disabled name="intelligence-modifier" class="form-control ability-modifier"
                        placeholder="+0">
                      <input name="intelligence-score" class="form-control ability-score" placeholder="10"
                        onchange="updateModifier(this, this.value)">
                    </div>
                    <hr />
                    <div class="form-check">
                      <input disable name="intelligence-save-check" type="checkbox"
                        class="form-check-input save-check" />
                      <span class="save-score"></span>
                      <label for="intelligence-save">Save</label>
                    </div>
                    <hr />
                    <div class="form-check">
                      <input name="arcana" type="checkbox" class="form-check-input arcana-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score arcana-score"></span>
                      <label for="Arcana">Arcana</label>
                    </div>
                    <div class="form-check">
                      <input name="history" type="checkbox" class="form-check-input history-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score history-score"></span>
                      <label for="History">History</label>
                    </div>
                    <div class="form-check">
                      <input name="investigation" type="checkbox" class="form-check-input investigation-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score investigation-score"></span>
                      <label for="Investigation">Investigation</label>
                    </div>
                    <div class="form-check">
                      <input name="nature" type="checkbox" class="form-check-input nature-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score nature-score"></span>
                      <label for="Nature">Nature</label>
                    </div>
                    <div class="form-check">
                      <input name="religion" type="checkbox" class="form-check-input religion-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score religion-score"></span>
                      <label for="Religion">Religion</label>
                    </div>
                  </div>
                  <div class="ability-card-footer"></div>
                </div>
                <div class="ability-card wisdom">
                  <div class="ability-card-header"></div>
                  <div class="ability-card-content">
                    <label for="wisdomscore" class="text-center w-100 title">Wisdom</label>
                    <div class="values">
                      <input disabled name="wisdom-modifier" class="form-control ability-modifier" placeholder="+0">
                      <input name="wisdom-score" class="form-control ability-score" placeholder="10"
                        onchange="updateModifier(this, this.value)">
                    </div>
                    <hr />
                    <div class="form-check">
                      <input disable name="wisdom-save-check" type="checkbox" class="form-check-input save-check" />
                      <span class="save-score"></span>
                      <label for="wisdom-save">Save</label>
                    </div>
                    <hr />
                    <div class="form-check">
                      <input name="animalHandling" type="checkbox" class="form-check-input animalHandling-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score animalHandling-score"></span>
                      <label for="Animal Handling">Animal Handling</label>
                    </div>
                    <div class="form-check">
                      <input name="insight" type="checkbox" class="form-check-input insight-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score insight-score"></span>
                      <label for="Insight">Insight</label>
                    </div>
                    <div class="form-check">
                      <input name="medicine" type="checkbox" class="form-check-input medicine-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score medicine-score"></span>
                      <label for="Medicine">Medicine</label>
                    </div>
                    <div class="form-check">
                      <input name="perception" type="checkbox" class="form-check-input perception-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score perception-score"></span>
                      <label for="Perception">Perception</label>
                    </div>
                    <div class="form-check">
                      <input name="survival" type="checkbox" class="form-check-input survival-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score survival-score"></span>
                      <label for="Survival">Survival</label>
                    </div>
                  </div>
                  <div class="ability-card-footer"></div>
                </div>
                <div class="ability-card charisma">
                  <div class="ability-card-header"></div>
                  <div class="ability-card-content">
                    <label for="charismascore" class="text-center w-100 title">Charisma</label>
                    <div class="values">
                      <input disabled name="charisma-modifier" class="form-control ability-modifier" placeholder="+0">
                      <input name="charisma-score" class="form-control ability-score" placeholder="10"
                        onchange="updateModifier(this, this.value)">
                    </div>
                    <hr />
                    <div class="form-check">
                      <input disable name="charisma-save-check" type="checkbox" class="form-check-input save-check" />
                      <span class="save-score"></span>
                      <label for="charisma-save">Save</label>
                    </div>
                    <hr />
                    <div class="form-check">
                      <input name="deception" type="checkbox" class="form-check-input deception-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score deception-score"></span>
                      <label for="deception">Deception</label>
                    </div>
                    <div class="form-check">
                      <input name="intimidation" type="checkbox" class="form-check-input intimidation-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score intimidation-score"></span>
                      <label for="intimidation">Intimidation</label>
                    </div>
                    <div class="form-check">
                      <input name="performance" type="checkbox" class="form-check-input performance-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score performance-score"></span>
                      <label for="Performance">Performance</label>
                    </div>
                    <div class="form-check">
                      <input name="persuasion" type="checkbox" class="form-check-input persuasion-check"
                        onchange="skillCheck(this)" />
                      <span class="skill-score persuasion-score"></span>
                      <label for="Persuasion">Persuasion</label>
                    </div>
                  </div>
                  <div class="ability-card-footer"></div>
                </div>
              </div>
            </div>
            <div class="block">
              entrainement et maitrises
            </div>
          </div>
          <div class="col d-flex flex-column gap-3">
            <div class="d-flex gap-2">
              <div class="flex-grow-1 flex-basis-0 block">initiative</div>
              <div class="flex-grow-1 flex-basis-0 block">speed</div>
              <div class="flex-grow-1 flex-basis-0 block">taille</div>
              <div class="flex-grow-1 flex-basis-0 block">perception passive</div>
            </div>
            <div class="">
              <div class="block">
                <div class="text-center title">armes & sorts mineurs</div>
                <hr />
              </div>
            </div>
            <div class="">
              <div class="block">
                <div class="text-center title">capacités de classe</div>
                <hr />
              </div>
            </div>
            <div class="d-flex gap-2">
              <div class="flex-grow-1 flex-basis-0 block">
                <div class="text-center title">traits d'epèce</div>
                <hr />
              </div>
              <div class="flex-grow-1 flex-basis-0 block">
                <div class="text-center title">dons</div>
                <hr />
              </div>
            </div>
          </div>
        </div>

        <label for="alignment" class="form-text">Alignment</label>
        <input name="alignment" class="form-control" placeholder="Lawful Good" />
      </form>
    </main>
  </div>
  <!-- External lib -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <!-- Inner lib -->
  <script src="fr.js"></script>
  <script src="i18n.js"></script>
  <script src="origins.js"></script>
  <script src="classes.js"></script>
  <script src="races.js"></script>

  <script src="lib.js"></script>
  <script src="index.js"></script>
</body>

</html>
