<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Character</title>
  <!-- External lib -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <!-- Inner lib -->
  <link rel="stylesheet" href="index.css" />
</head>

<body translate="no">
  <div class="d-flex flex-nowrap">
    <main class="container">
      <form>
        <div class="d-flex flex-row mt-2">
          <div class="w-100 p-2 border common-informations">
            <div class="d-flex">
              <div class="w-100 charName">
                <input name="charName" class="form-control border-0 border-bottom rounded-0 px-0"
                  placeholder="Thoradin Fireforge" />
                <label for="charName" class="form-text mt-0" data-i18n="charName._label">Character Name</label>
              </div>
            </div>
            <div class="d-flex gap-3 mb-2">
              <div class="w-100 charOrigin">
                <select name="charOrigin" class="form-select border-0 border-bottom rounded-0 p-0"></select>
                <label for="charOrigin" class="form-text mt-0" data-i18n="origins._label">Origin</label>
              </div>
              <div class="w-100 charClass">
                <select name="charClass" class="form-select border-0 border-bottom rounded-0 p-0"></select>
                <label for="charClass" class="form-text mt-0" data-i18n="classes._label">Class</label>
              </div>
            </div>
            <div class="d-flex gap-3">
              <div class="w-100 charRace">
                <select name="charRace" class="form-control border-0 border-bottom rounded-0 p-0"></select>
                <label for="charRace" class="form-text" data-i18n="races._label">Race</label>
              </div>
              <div class="w-100 charSubClass">
                <select name="charSubClass" class="form-select border-0 border-bottom rounded-0 p-0">
                  <option>Select class first</option>
                </select>
                <label for="charSubClass" class="form-text mt-0" data-i18n="subClasses._label">Subclass</label>
              </div>
            </div>
          </div>

          <div class="d-flex">
            <div class="d-flex flex-column align-items-center border rounded-circle justify-content-center">
              <input name="charLevel" class="form-control text-center" placeholder="0" />
              <label for="charLevel" class="form-text text-center">Level</label>
              <input name="experiencepoints" class="form-control text-center" placeholder="0" />
              <label for="experiencepoints" class="form-text text-center">Experience Points</label>
            </div>
            <div class="d-flex flex-column align-items-center">
              <label for="armorClass" class="form-text text-center">Armor Class</label>
              <input name="armorClass" class="form-control" placeholder="0" />
              <label for="shield" class="form-text text-center">Shield</label>
              <input name="shield" type="checkbox" class="form-check-input" />
            </div>
          </div>

          <div class="w-100 d-flex border misc">
            <div class="d-flex flex-column m-2 hit-points">
              <span class="text-center">Hit Points</span>
              <div class="d-flex align-items-stretch">
                <div class="d-flex flex-column">
                  <input name="currentHp" class="flex-fill form-control border-0 border-bottom rounded-0" />
                  <label for="currentHp" class="form-text">Current</label>
                </div>

                <div class="vr mx-2"></div>

                <div class="d-flex flex-column">
                  <input name="tempHp" class="form-control border-0 border-bottom rounded-0" />
                  <label for="tempHp" class="form-text">Temp</label>
                  <input name="maxHp" class="form-control border-0 border-bottom rounded-0" />
                  <label for="maxHp" class="form-text">Max</label>
                </div>
              </div>
            </div>

            <div class="vr"></div>

            <div class="d-flex flex-column m-2 hit-dice">
              <span class="text-center">Hit Dice</span>
              <input name="spentHd" class="form-control border-0 border-bottom rounded-0" />
              <label for="spentHd" class="form-text">Spent</label>
              <input name="maxHd" class="form-control border-0 border-bottom rounded-0" />
              <label for="maxHd" class="form-text">Max</label>
            </div>

            <div class="vr"></div>

            <div class="m-2 death-saves">
              <span class="text-center">Death Saves</span>
              <input type="checkbox" class="form-check-input" />
              <input type="checkbox" class="form-check-input" />
              <input type="checkbox" class="form-check-input" />
              <label>Successes</label>
              <input type="checkbox" class="form-check-input" />
              <input type="checkbox" class="form-check-input" />
              <input type="checkbox" class="form-check-input" />
              <label>Failures</label>
            </div>
          </div>
        </div>

        <hr />

        <div class="row">
          <div class="col-4">
            <div class="d-flex gap-3">
              <div class="d-flex flex-column gap-3">
                <div class="border p-2 rounded">
                  <label for="proficiencybonus" class="text-center w-100">Proficiency Bonus</label>
                  <input disabled name="proficiencybonus" class="form-control p-0 border-0 border-bottom text-center"
                    placeholder="+2">
                </div>
                <div class="border p-2 rounded">
                  <label for="strengthscore" class="text-center w-100">Strength</label>
                  <input name="strength" class="form-control" placeholder="10"
                    onchange="updateModifier(this, this.value)" />
                  <input disabled name="strengthModifier" class="form-control" placeholder="+0">
                  <hr />
                  <div class="form-check">
                    <input disable name="strengthSaveProf" type="checkbox" class="form-check-input" />
                    <span name="strengthSave"></span>
                    <label for="strength-save">Save</label>
                  </div>
                  <hr />
                  <div class="form-check">
                    <input name="athletics" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="athleticsScore"></span>
                    <label for="Athletics">Athletics</label>
                  </div>
                </div>
                <div class="border p-2 rounded">
                  <label for="dexterityscore" class="text-center w-100">Dexterity</label>
                  <input name="dexterity" class="form-control" placeholder="10"
                    onchange="updateModifier(this, this.value)">
                  <input disabled name="dexterityModifier" class="form-control" placeholder="+0">
                  <hr />
                  <div class="form-check">
                    <input disable name="dexteritySaveProf" type="checkbox" class="form-check-input" />
                    <span name="dexteritySave"></span>
                    <label for="dexterity-save">Save</label>
                  </div>
                  <hr />
                  <div class="form-check">
                    <input name="acrobatics" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="acrobaticsScore"></span>
                    <label for="Acrobatics">Acrobatics</label>
                  </div>
                  <div class="form-check">
                    <input name="sleightOfHand" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="sleightOfHandScore"></span>
                    <label for="Sleight of Hand">Sleight of Hand</label>
                  </div>
                  <div class="form-check">
                    <input name="stealth" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="stealthScore"></span>
                    <label for="Stealth">Stealth</label>
                  </div>
                </div>
                <div class="border p-2 rounded">
                  <label for="constitutionscore" class="text-center w-100">Constitution</label>
                  <input name="constitution" class="form-control" placeholder="10"
                    onchange="updateModifier(this, this.value)">
                  <input disabled name="constitutionModifier" class="form-control" placeholder="+0">
                  <hr />
                  <div class="form-check">
                    <input disable name="constitutionSaveProf" type="checkbox" class="form-check-input" />
                    <span name="constitutionSave"></span>
                    <label for="constitution-save">Save</label>
                  </div>
                </div>
                <div class="border p-2 rounded">
                  <label for="inspiration" class="text-center w-100">Inspiration</label>
                  <input name="inspiration" type="checkbox" class="form-check-input" />
                </div>
              </div>
              <div class="d-flex flex-column gap-3">
                <div class="border p-2 rounded">
                  <label for="intelligencescore" class="text-center w-100">Intelligence</label>
                  <input name="intelligence" class="form-control" placeholder="10"
                    onchange="updateModifier(this, this.value)">
                  <input disabled name="intelligenceModifier" class="form-control" placeholder="+0">
                  <hr />
                  <div class="form-check">
                    <input disable name="intelligenceSaveProf" type="checkbox" class="form-check-input" />
                    <span name="intelligenceSave"></span>
                    <label for="intelligence-save">Save</label>
                  </div>
                  <hr />
                  <div class="form-check">
                    <input name="arcana" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="arcanaScore"></span>
                    <label for="Arcana">Arcana</label>
                  </div>
                  <div class="form-check">
                    <input name="history" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="historyScore"></span>
                    <label for="History">History</label>
                  </div>
                  <div class="form-check">
                    <input name="investigation" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="investigationScore"></span>
                    <label for="Investigation">Investigation</label>
                  </div>
                  <div class="form-check">
                    <input name="nature" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="natureScore"></span>
                    <label for="Nature">Nature</label>
                  </div>
                  <div class="form-check">
                    <input name="religion" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="religionScore"></span>
                    <label for="Religion">Religion</label>
                  </div>
                </div>
                <div class="border p-2 rounded">
                  <label for="wisdomscore" class="text-center w-100">Wisdom</label>
                  <input name="wisdom" class="form-control" placeholder="10"
                    onchange="updateModifier(this, this.value)">
                  <input disabled name="wisdomModifier" class="form-control" placeholder="+0">
                  <hr />
                  <div class="form-check">
                    <input disable name="wisdomSaveProf" type="checkbox" class="form-check-input" />
                    <span name="wisdomSave"></span>
                    <label for="wisdom-save">Save</label>
                  </div>
                  <hr />
                  <div class="form-check">
                    <input name="animalHandling" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="animalHandlingScore"></span>
                    <label for="Animal Handling">Animal Handling</label>
                  </div>
                  <div class="form-check">
                    <input name="insight" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="insightScore"></span>
                    <label for="Insight">Insight</label>
                  </div>
                  <div class="form-check">
                    <input name="medicine" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="medicineScore"></span>
                    <label for="Medicine">Medicine</label>
                  </div>
                  <div class="form-check">
                    <input name="perception" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="perceptionScore"></span>
                    <label for="Perception">Perception</label>
                  </div>
                  <div class="form-check">
                    <input name="survival" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="survivalScore"></span>
                    <label for="Survival">Survival</label>
                  </div>
                </div>
                <div class="border p-2 rounded">
                  <label for="charismascore" class="text-center w-100">Charisma</label>
                  <input name="charisma" class="form-control" placeholder="10"
                    onchange="updateModifier(this, this.value)">
                  <input disabled name="charismaModifier" class="form-control" placeholder="+0">
                  <hr />
                  <div class="form-check">
                    <input disable name="charismaSaveProf" type="checkbox" class="form-check-input" />
                    <span name="charismaSave"></span>
                    <label for="charisma-save">Save</label>
                  </div>
                  <hr />
                  <div class="form-check">
                    <input name="deception" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="deceptionScore"></span>
                    <label for="Deception">Deception</label>
                  </div>
                  <div class="form-check">
                    <input name="intimidation" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="intimidationScore"></span>
                    <label for="Intimidation">Intimidation</label>
                  </div>
                  <div class="form-check">
                    <input name="performance" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="performanceScore"></span>
                    <label for="Performance">Performance</label>
                  </div>
                  <div class="form-check">
                    <input name="persuasion" type="checkbox" class="form-check-input" onchange="skillCheck(this)" />
                    <span name="persuasionScore"></span>
                    <label for="Persuasion">Persuasion</label>
                  </div>
                </div>
              </div>
            </div>
            <div class="row">
              entrainement et maitrises
            </div>
          </div>
          <div class="col">
            <div class="row">
              <div class="col">initiative</div>
              <div class="col">speed</div>
              <div class="col">taille</div>
              <div class="col">perception passive</div>
            </div>
            <div class="row">
              <div class="col">armes & sorts mineurs</div>
            </div>
            <div class="row">
              <div class="col">capacités de classe</div>
            </div>
            <div class="row">
              <div class="col">traits d'epèce</div>
              <div class="col">dons</div>
            </div>
          </div>
        </div>


        <label for="alignment" class="form-text">Alignment</label>
        <input name="alignment" class="form-control" placeholder="Lawful Good" />
      </form>
    </main>
  </div>
  <!-- External lib -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <!-- Inner lib -->
  <script src="fr.js"></script>
  <script src="i18n.js"></script>
  <script src="origins.js"></script>
  <script src="classes.js"></script>
  <script src="races.js"></script>

  <script src="lib.js"></script>
  <script src="index.js"></script>
</body>

</html>
