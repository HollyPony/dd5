<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Character creator</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="manifest" href="./site.webmanifest">

  <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" /> -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

<body translate="no" data-bs-theme="dark">
  <app-navbar></app-navbar>

  <main class="container mt-3">
    <form method="post">
      <div class="row g-3">
        <common-informations-block class="d-block col-12 col-md common-informations"></common-informations-block>
        <level-armor-block class="d-block col-12 col-md-auto d-flex justify-content-center"></level-armor-block>
        <vitals-block class="d-block col-12 col-md d-flex col-md misc"></vitals-block>
      </div>

      <hr />

      <div class="row g-3">
        <div class="col-md-4 d-grid gap-3">
          <stats-block></stats-block>
          <trainings-block></trainings-block>
          <character-profile-block></character-profile-block>
          <backpack-block></backpack-block>
          <currency-block></currency-block>
        </div>
        <div class="col">
          <div class="row row-cols-1 g-3">
            <specs-block class="d-block col"></specs-block>
            <weapons-cantrip class="d-block col"></weapons-cantrip>
            <class-features class="d-block col"></class-features>
            <div class="col d-flex gap-2">
              <species-traits class="flex-grow-1 flex-basis-0"></species-traits>
              <feats-block class="flex-grow-1 flex-basis-0"></feats-block>
            </div>
            <spellbook-block class="d-block col"></spellbook-block>
          </div>
        </div>
      </div>
    </form>
  </main>

  <!-- TODO: Implement it -> translate-->

    <ul class="nav justify-content-center border-bottom pb-3 mb-3">
      <li class="nav-item"><a href="https://github.com/HollyPony/dd5" class="nav-link px-2 text-body-secondary">Github</a></li>
      <li class="nav-item"><a href="https://hollypony.github.io" class="nav-link px-2 text-body-secondary">D&D Other apps</a></li>
      <!-- TODO: modal -->
      <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">About</a></li>
    </ul>
    <p class="text-center text-body-secondary">© 20** CopyrightToTheLeft</p>
  </footer>

  <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>

  <!-- External lib -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"

  <script type="module" src="index.js"></script>
