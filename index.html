  <main class="container mt-3">
    <form method="post">
      <div class="row g-3">
        <div class="col-12 col-md common-informations">
          <div class="border p-2">
            <div class="row">
              <div class="col d-flex flex-column charName">
                <input name="charName" class="form-control-input" placeholder="Thoradin Fireforge" />
                <label for="charName" class="form-control-label" data-i18n="charName.label"></label>
              </div>
            </div>
            <div class="row">
              <div class="col-6 d-flex flex-column charOrigin">
                <origin-select></origin-select>
                <label for="charOrigin" class="form-control-label" data-i18n="origins.label"></label>
              </div>
              <div class="col-6 d-flex flex-column charClass">
                <class-select></class-select>
                <label for="charClass" class="form-control-label" data-i18n="classes.label"></label>
              </div>
            </div>
            <div class="row">
              <div class="col-6 d-flex flex-column charSpecies">
                <species-select></species-select>
                <label for="charSpecies" class="form-control-label" data-i18n="species.label"></label>
              </div>
              <div class="col-6 d-flex flex-column charSubClass">
                <sub-class-select></sub-class-select>
                <label for="charSubClass" class="form-control-label" data-i18n="subClasses.label"></label>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-auto d-flex justify-content-center">
          <div class="row">
            <div
              class="col-6 d-flex flex-column justify-content-center align-items-center border rounded-circle level-block">
              <input name="charLevel"
                class="form-control border-0 border-bottom rounded-0 text-center bg-transparent p-0 lh-1 fs-1 level"
                placeholder="0" />
              <label for="charLevel" class="form-text text-center mt-0 level" data-i18n="level.label"></label>
              <input name="experiencepoints"
                class="form-control border-0 border-bottom rounded-0 px-0 text-center bg-transparent pb-0 xp"
                placeholder="0" />
              <label for="experiencepoints" class="form-text text-center mt-0 xp"
                data-i18n="experiencepoints.label"></label>
            </div>
            <div class="col-6 d-flex flex-column justify-content-center align-items-center armorclass-block">
              <label for="armorClass" class="form-text text-center title" data-i18n="armorclass.label"></label>
              <input name="armorClass"
                class="form-control border-0 border-bottom rounded-0 text-center p-0 lh-1 fs-1 armorclass"
                placeholder="0" />
              <label for="shield" class="form-text text-center">Shield</label>
              <input name="shield" type="checkbox" class="form-check-input shield-check" />
            </div>
          </div>
        </div>

        <div class="col-12 col-md d-flex col-md misc">
          <div class="row g-0">
            <div class="col-6 d-flex align-items-stretch">
              <div class="d-flex border border-end-0">
                <div class="d-flex flex-column p-2 hit-points">
                  <span class="text-center title">Hit Points</span>
                  <div class="d-flex flex-grow-1">
                    <div class="d-flex flex-column flex-grow-1 flex-shrink-1 flex-basis-0">
                      <input name="hitPointCurrent"
                        class="flex-fill form-control border-0 border-bottom rounded-0 p-0 text-center fs-1" />
                      <label for="hitPointCurrent" class="form-text mt-0">Current</label>
                    </div>

                    <div class="vr mx-2"></div>

                    <div class="d-flex flex-column justify-content-end flex-grow-1 flex-shrink-1 flex-basis-0">
                      <input name="hitPointTemp"
                        class="form-control border-0 border-bottom rounded-0 p-0 text-center mt-2" />
                      <label for="hitPointTemp" class="form-text mt-0">Temp</label>
                      <input name="hitPointMax"
                        class="form-control border-0 border-bottom rounded-0 p-0 text-center mt-2" />
                      <label for="hitPointMax" class="form-text mt-0">Max</label>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-3 d-flex align-items-stretch">
              <div class="d-flex border border-end-0">
                <div class="d-flex flex-column p-2 hit-dice">
                  <span class="text-center title">Hit Dice</span>
                  <div class="d-flex flex-grow-1 flex-column justify-content-end">
                    <input name="hitDiceSpent"
                      class="form-control border-0 border-bottom rounded-0 p-0 text-center mt-2" />
                    <label for="hitDiceSpent" class="form-text mt-0">Spent</label>
                    <input name="hitDiceMax"
                      class="form-control border-0 border-bottom rounded-0 p-0 text-center mt-2" />
                    <label for="hitDiceMax" class="form-text mt-0">Max</label>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-3 d-flex align-items-stretch">
              <div class="border">
                <div class="m-2 death-saves">
                  <span class="text-center title">Death Saves</span>
                  <div>
                    <input type="checkbox" class="form-check-input" />
                    <input type="checkbox" class="form-check-input" />
                    <input type="checkbox" class="form-check-input" />
                    <label>Successes</label>
                  </div>
                  <div>
                    <input type="checkbox" class="form-check-input" />
                    <input type="checkbox" class="form-check-input" />
                    <input type="checkbox" class="form-check-input" />
                    <label>Failures</label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <hr />

      <div class="row g-3">
        <div class="col-md-4">
          <div class="row gx-2">
            <div class="col-6 d-flex flex-column gap-2">
              <div class="block proficiency">
                <label for="proficiencybonus" class="text-center w-100 title"
                  data-i18n="stats.proficiencyBonus"></label>
                <hr class="m-0 border-2 w-100" />
                <input disabled name="proficiencybonus" class="form-control p-0 border-top-0 rounded-top-0 text-center"
                  placeholder="+2">
              </div>
              <ability-card data-ability="strength"></ability-card>
              <ability-card data-ability="dexterity"></ability-card>
              <ability-card data-ability="constitution"></ability-card>

              <div class="block inspiration">
                <label for="inspiration" class="text-center w-100 title" data-i18n="stats.inspiration"></label>
                <hr class="m-0 border-2 w-100" />
                <input name="inspiration" type="checkbox"
                  class="form-check-input inspiration-check mt-0 rounded-top-0 border-top-0" />
              </div>
            </div>
            <div class="col-6 d-flex flex-column gap-3">
              <ability-card data-ability="intelligence"></ability-card>
              <ability-card data-ability="wisdom"></ability-card>
              <ability-card data-ability="charisma"></ability-card>
            </div>
          </div>
          <div class="row mt-3">
            <div class="col">
              <div class="block">
                <div class="text-center title" data-i18n="stats.trainings.title"></div>
                <div class="trainings-armors mb-2">
                  <span class="fw-bold" data-i18n="stats.trainings.armor.title"></span>
                  <input name="trainings-armor-light" type="checkbox" class="form-check-input" />
                  <label for="trainings-armor-light" data-i18n="stats.trainings.armor.light"></label>
                  <input name="trainings-armor-medium" type="checkbox" class="form-check-input" />
                  <label for="trainings-armor-medium" data-i18n="stats.trainings.armor.medium"></label>
                  <input name="trainings-armor-heavy" type="checkbox" class="form-check-input" />
                  <label for="trainings-armor-heavy" data-i18n="stats.trainings.armor.heavy"></label>
                  <input name="trainings-shield" type="checkbox" class="form-check-input" />
                  <label for="trainings-shield" data-i18n="stats.trainings.shield"></label>
                </div>
                <div class="trainings-weapons mb-2">
                  <span class="fw-bold" data-i18n="stats.trainings.weapons.title"></span>
                  <div class="trainings-weapons-list"></div>
                </div>
                <div class="trainings-tools">
                  <span class="fw-bold" data-i18n="stats.trainings.tools.title"></span>
                  <div class="trainings-tools-list"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="row row-cols-1 g-3">
            <div class="col">
              <div class="row g-2 specs">
                <div class="col-6 d-flex col-sm-3">
                  <div class="block flex-grow-1">
                    <label for="specs.initiative" class="text-center title" data-i18n="specs.initiative"></label>
                    <input disabled name="specs.initiative"
                      class="form-control my-auto p-0 border-0 border-bottom text-center" placeholder="+2">
                  </div>
                </div>
                <div class="col-6 d-flex col-sm-3">
                  <div class="block flex-grow-1">
                    <label for="specs.speed" class="text-center title" data-i18n="specs.speed"></label>
                    <input disabled name="specs.speed"
                      class="form-control my-auto p-0 border-0 border-bottom text-center">
                  </div>
                </div>
                <div class="col-6 d-flex col-sm-3">
                  <div class="block flex-grow-1">
                    <label for="specs.size" class="text-center title" data-i18n="specs.size"></label>
                    <div class="input-group my-auto">
                      <select
                        class="form-select border-0 border-bottom rounded-0 p-0 pe-5 w-auto flex-grow-0 size-category">
                        <option value="small" data-i18n="sizeCategory.small"></option>
                        <option value="medium" data-i18n="sizeCategory.medium"></option>
                      </select>
                      <input type="text" name="specs.size" class="form-control p-0 border-0 border-bottom text-end"
                        placeholder="175 cm" size="3">
                      <span class="input-group-text border-0 border-bottom p-0 ps-2 rounded-0"
                        id="basic-addon2">cm</span>
                    </div>
                  </div>
                </div>
                <div class="col-6 d-flex col-sm-3">
                  <div class="block flex-grow-1">
                    <label for="specs.passivePerception" class="text-center title"
                      data-i18n="specs.passivePerception"></label>
                    <input disabled name="specs.passivePerception"
                      class="form-control my-auto p-0 border-0 border-bottom text-center">
                  </div>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="block weaponscantrip-block">
                <div class="text-center title" data-i18n="weaponscantrip.title"></div>
                <ul class="list-group">
                  <!-- <li class="list-group-item"></li> -->
                </ul>
                <select name="weapons" class="form-select border-0 border-bottom rounded-0 p-0"></select>
              </div>
            </div>
            <div class="col">
              <div class="block class-features-block">
                <span class="position-absolute top-0 start-0 translate-middle p-2 bg-danger border rounded-circle z-1">
                </span>


                <div class="text-center title" data-i18n="class-features.title"></div>
                <hr class="mt-0 border-3" />
                <div id="class-features-accordion-base" class="accordion class-features-base mb-3">
                  <div class="accordion-item">
                    <div class="accordion-header d-flex align-items-center position-relative">
                      <span
                        class="position-absolute top-0 start-0 translate-middle p-2 bg-danger border rounded-circle z-4">
                      </span>

                      <button class="accordion-button shadow-none py-2 collapsed" type="button"
                        data-bs-toggle="collapse" data-bs-target="#collapse-class-features-base"
                        data-i18n="class-features.expandBtn">
                        <strong>Base</strong> - sd
                      </button>

                    </div>
                    <div id="collapse-class-features-base" class="accordion-collapse collapse"
                      data-bs-parent="#class-features-accordion-base">
                      <div class="accordion-body p-0">
                        <div class="card border-0">
                          <div class="card-header align-center">
                            <span class="d-flex red-circle" data-i18n="class-features.base.skills.title"></span>
                          </div>
                          <div class="card-body">
                            <div class="card-text mb-3">
                              <span>Il y a N compétences à choisir</span>
                            </div>

                            <div class="d-flex flex-wrap gap-3">
                              <input type="checkbox" class="btn-check" id="btn-check" autocomplete="off">
                              <label class="btn btn-outline-primary" for="btn-check">Single toggle</label>

                              <input type="checkbox" class="btn-check" id="btn-check" autocomplete="off">
                              <label class="btn btn-outline-primary" for="btn-check">Single toggle</label>

                              <input type="checkbox" class="btn-check" id="btn-check" autocomplete="off">
                              <label class="btn btn-outline-primary" for="btn-check">Single toggle</label>

                              <input type="checkbox" class="btn-check" id="btn-check" autocomplete="off">
                              <label class="btn btn-outline-primary" for="btn-check">Single toggle</label>

                              <input type="checkbox" class="btn-check" id="btn-check" autocomplete="off">
                              <label class="btn btn-outline-primary" for="btn-check">Single toggle</label>

                              <input type="checkbox" class="btn-check" id="btn-check" autocomplete="off">
                              <label class="btn btn-outline-primary" for="btn-check">Single toggle</label>

                              <input type="checkbox" class="btn-check" id="btn-check" autocomplete="off">
                              <label class="btn btn-outline-primary" for="btn-check">Single toggle</label>

                              <input type="checkbox" class="btn-check" id="btn-check" autocomplete="off">
                              <label class="btn btn-outline-primary" for="btn-check">Single toggle</label>
                            </div>
                          </div>
                        </div>
                      </div>
                      <div class="card border-0">
                        <div class="card-header" data-i18n="class-features.base.tools.title"></div>
                        <div class="card-body">
                          <div class="card-text">card text</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <hr class="border-3" />

                <div id="class-features-accordion" class="accordion class-features"></div>
              </div>
            </div>
            <div class="col">
              <div class="d-flex gap-2">
                <div class="flex-grow-1 flex-basis-0 block species-traits">
                  <div class="text-center title" data-i18n="species.title"></div>
                  <ul class="list-group species-traits"></ul>
                </div>
                <div class="flex-grow-1 flex-basis-0 block feats">
                  <div class="text-center title" data-i18n="feats.title">
                    <ul class="list-group feats"></ul>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      </div>

      <label for="alignment" class="form-text" data-i18n="alignment.title"></label>
      <input name="alignment" class="form-control" placeholder="Lawful Good" />
    </form>
  </main>

  <!-- External lib -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script src="fr.js"></script>

</body>

</html>
