<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="index.css">
    <title>Character</title>
  </head>
  
  <body translate="no">
    <form class="charsheet">
      <header>
        <section class="charname">
          <label for="charname">Character Name</label><input name="charname" placeholder="Thoradin Fireforge">
        </section>
        <section class="misc">
          <ul>
            <li>
              <label for="classlevel">Class &amp; Level</label><input name="classlevel" placeholder="Paladin 2">
              <select>
                <option name="e">3</option>
                <option name="f">3</option>
              </select>
            </li>
            <li>
              <label for="origin">Background</label><input name="origin" placeholder="Acolyte">
            </li>
            <li>
              <label for="playername">Player Name</label><input name="playername" placeholder="Player McPlayerface">
            </li>
            <li>
              <label for="race">Race</label><input name="race" placeholder="Half-elf">
            </li>
            <li>
              <label for="alignment">Alignment</label><input name="alignment" placeholder="Lawful Good">
            </li>
            <li>
              <label for="experiencepoints">Experience Points</label><input name="experiencepoints" placeholder="0">
            </li>
          </ul>
        </section>
      </header>
      <main>
        <section>
          <section class="attributes">
            <div class="scores">
              <ul>
                <li>
                  <div class="score">
                    <label for="Strengthscore">Strength</label><input name="strength" placeholder="10" onchange="updateModifier(this, this.value)">
                  </div>
                  <div class="modifier">
                    <input disabled name="strengthModifier" placeholder="+0">
                  </div>
                </li>
                <li>
                  <div class="score">
                    <label for="Dexterityscore">Dexterity</label><input name="dexterity" placeholder="10" onchange="updateModifier(this, this.value)">
                  </div>
                  <div class="modifier">
                    <input disabled name="dexterityModifier" placeholder="+0">
                  </div>
                </li>
                <li>
                  <div class="score">
                    <label for="Constitutionscore">Constitution</label><input name="constitution" placeholder="10" onchange="updateModifier(this, this.value)">
                  </div>
                  <div class="modifier">
                    <input disabled name="constitutionModifier" placeholder="+0">
                  </div>
                </li>
                <li>
                  <div class="score">
                    <label for="Wisdomscore">Wisdom</label><input name="wisdom" placeholder="10" onchange="updateModifier(this, this.value)">
                  </div>
                  <div class="modifier">
                    <input disabled name="wisdomModifier" placeholder="+0">
                  </div>
                </li>
                <li>
                  <div class="score">
                    <label for="Intelligencescore">Intelligence</label><input name="intelligence" placeholder="10" onchange="updateModifier(this, this.value)">
                  </div>
                  <div class="modifier">
                    <input disabled name="intelligenceModifier" placeholder="+0">
                  </div>
                </li>
                <li>
                  <div class="score">
                    <label for="Charismascore">Charisma</label><input name="charisma" placeholder="10" onchange="updateModifier(this, this.value)">
                  </div>
                  <div class="modifier">
                    <input disabled name="charismaModifier" placeholder="+0">
                  </div>
                </li>
              </ul>
            </div>
            <div class="attr-applications">
              <div class="inspiration box">
                <div class="label-container">
                  <label for="inspiration">Inspiration</label>
                </div>
                <input name="inspiration" type="checkbox">
              </div>
              <div class="proficiencybonus box">
                <div class="label-container">
                  <label for="proficiencybonus">Proficiency Bonus</label>
                </div>
                <input name="proficiencybonus" placeholder="+2">
              </div>
              <div class="saves list-section box">
                <ul>
                  <li>
                    <label for="Strength-save">Strength</label><input name="strengthSave" placeholder="+0" type="text"><input name="strengthSaveProf" type="checkbox">
                  </li>
                  <li>
                    <label for="Dexterity-save">Dexterity</label><input name="dexteritySave" placeholder="+0" type="text"><input name="dexteritySaveProf" type="checkbox">
                  </li>
                  <li>
                    <label for="Constitution-save">Constitution</label><input name="constitutionSave" placeholder="+0" type="text"><input name="constitutionSaveProf" type="checkbox">
                  </li>
                  <li>
                    <label for="Wisdom-save">Wisdom</label><input name="wisdomSave" placeholder="+0" type="text"><input name="wisdomSaveProf" type="checkbox">
                  </li>
                  <li>
                    <label for="Intelligence-save">Intelligence</label><input name="intelligenceSave" placeholder="+0" type="text"><input name="intelligenceSaveProf" type="checkbox">
                  </li>
                  <li>
                    <label for="Charisma-save">Charisma</label><input name="charismaSave" placeholder="+0" type="text"><input name="charismaSaveProf" type="checkbox">
                  </li>
                </ul>
                <div class="label">
                  Saving Throws
                </div>
              </div>
              <div class="skills list-section box">
                <ul>
                  <li>
                    <label for="Acrobatics">Acrobatics <span class="skill">(Dex)</span></label><input name="acrobaticsScore" placeholder="+0" type="text"><input name="acrobatics" type="checkbox" onchange="skillCheck(this)">
                  </li>
                  <li>
                    <label for="Animal Handling">Animal Handling <span class="skill">(Wis)</span></label><input name="animalHandlingScore" placeholder="+0" type="text"><input name="animalHandling" type="checkbox" onchange="skillCheck(this)">
                  </li>
                  <li>
                    <label for="Arcana">Arcana <span class="skill">(Int)</span></label><input name="arcanaScore" placeholder="+0" type="text"><input name="arcana" type="checkbox" onchange="skillCheck(this)">
                  </li>
                  <li>
                    <label for="Athletics">Athletics <span class="skill">(Str)</span></label><input name="athleticsScore" placeholder="+0" type="text"><input name="athletics" type="checkbox" onchange="skillCheck(this)">
                  </li>
                  <li>
                    <label for="Deception">Deception <span class="skill">(Cha)</span></label><input name="deceptionScore" placeholder="+0" type="text"><input name="deception" type="checkbox" onchange="skillCheck(this)">
                  </li>
                  <li>
                    <label for="History">History <span class="skill">(Int)</span></label><input name="historyScore" placeholder="+0" type="text"><input name="history" type="checkbox" onchange="skillCheck(this)">
                  </li>
                  <li>
                    <label for="Insight">Insight <span class="skill">(Wis)</span></label><input name="insightScore" placeholder="+0" type="text"><input name="insight" type="checkbox" onchange="skillCheck(this)">
                  </li>
                  <li>
                    <label for="Intimidation">Intimidation <span class="skill">(Cha)</span></label><input name="intimidationScore" placeholder="+0" type="text"><input name="intimidation" type="checkbox" onchange="skillCheck(this)">
                  </li>
                  <li>
                    <label for="Investigation">Investigation <span class="skill">(Int)</span></label><input name="investigationScore" placeholder="+0" type="text"><input name="investigation" type="checkbox" onchange="skillCheck(this)">
                  </li>
                  <li>
                    <label for="Medicine">Medicine <span class="skill">(Wis)</span></label><input name="medicineScore" placeholder="+0" type="text"><input name="medicine" type="checkbox" onchange="skillCheck(this)">
                  </li>
                  <li>
                    <label for="Nature">Nature <span class="skill">(Int)</span></label><input name="natureScore" placeholder="+0" type="text"><input name="nature" type="checkbox" onchange="skillCheck(this)">
                  </li>
                  <li>
                    <label for="Perception">Perception <span class="skill">(Wis)</span></label><input name="perceptionScore" placeholder="+0" type="text"><input name="perception" type="checkbox" onchange="skillCheck(this)">
                  </li>
                  <li>
                    <label for="Performance">Performance <span class="skill">(Cha)</span></label><input name="performanceScore" placeholder="+0" type="text"><input name="performance" type="checkbox" onchange="skillCheck(this)">
                  </li>
                  <li>
                    <label for="Persuasion">Persuasion <span class="skill">(Cha)</span></label><input name="persuasionScore" placeholder="+0" type="text"><input name="persuasion" type="checkbox" onchange="skillCheck(this)">
                  </li>
                  <li>
                    <label for="Religion">Religion <span class="skill">(Int)</span></label><input name="religionScore" placeholder="+0" type="text"><input name="religion" type="checkbox" onchange="skillCheck(this)">
                  </li>
                  <li>
                    <label for="Sleight of Hand">Sleight of Hand <span class="skill">(Dex)</span></label><input name="sleightOfHandScore" placeholder="+0" type="text"><input name="sleightOfHand" type="checkbox" onchange="skillCheck(this)">
                  </li>
                  <li>
                    <label for="Stealth">Stealth <span class="skill">(Dex)</span></label><input name="stealthScore" placeholder="+0" type="text"><input name="stealth" type="checkbox" onchange="skillCheck(this)">
                  </li>
                  <li>
                    <label for="Survival">Survival <span class="skill">(Wis)</span></label><input name="survivalScore" placeholder="+0" type="text"><input name="survival" type="checkbox" onchange="skillCheck(this)">
                  </li>
                </ul>
                <div class="label">
                  Skills
                </div>
              </div>
            </div>
          </section>
          <div class="passive-perception box">
            <div class="label-container">
              <label for="passiveperception">Passive Wisdom (Perception)</label>
            </div>
            <input name="passiveperception" placeholder="10">
          </div>
          <div class="otherprofs box textblock">
            <label for="otherprofs">Other Proficiencies and Languages</label><textarea name="otherprofs"></textarea>
          </div>
        </section>
        <section>
          <section class="combat">
            <div class="armorclass">
              <div>
                <label for="ac">Armor Class</label><input name="ac" placeholder="10" type="text">
              </div>
            </div>
            <div class="initiative">
              <div>
                <label for="initiative">Initiative</label><input name="initiative" placeholder="+0" type="text">
              </div>
            </div>
            <div class="speed">
              <div>
                <label for="speed">Speed</label><input name="speed" placeholder="30" type="text">
              </div>
            </div>
            <div class="hp">
              <div class="regular">
                <div class="max">
                  <label for="maxhp">Hit Point Maximum</label><input name="maxhp" placeholder="10" type="text">
                </div>
                <div class="current">
                  <label for="currenthp">Current Hit Points</label><input name="currenthp" type="text">
                </div>
              </div>
              <div class="temporary">
                <label for="temphp">Temporary Hit Points</label><input name="temphp" type="text">
              </div>
            </div>
            <div class="hitdice">
              <div>
                <div class="total">
                  <label for="totalhd">Total</label><input name="totalhd" placeholder="2d10" type="text">
                </div>
                <div class="remaining">
                  <label for="remaininghd">Hit Dice</label><input name="remaininghd" type="text">
                </div>
              </div>
            </div>
            <div class="deathsaves">
              <div>
                <div class="label">
                  <label>Death Saves</label>
                </div>
                <div class="marks">
                  <div class="deathsuccesses">
                    <label>Successes</label>
                    <div class="bubbles">
                      <input name="deathsuccess1" type="checkbox">
                      <input name="deathsuccess2" type="checkbox">
                      <input name="deathsuccess3" type="checkbox">
                    </div>
                  </div>
                  <div class="deathfails">
                    <label>Failures</label>
                    <div class="bubbles">
                      <input name="deathfail1" type="checkbox">
                      <input name="deathfail2" type="checkbox">
                      <input name="deathfail3" type="checkbox">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
          <section class="attacksandspellcasting">
            <div>
              <label>Attacks &amp; Spellcasting</label>
              <table>
                <thead>
                  <tr>
                    <th>
                      Name
                    </th>
                    <th>
                      Atk Bonus
                    </th>
                    <th>
                      Damage/Type
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>
                      <input name="atkname1" type="text">
                    </td>
                    <td>
                      <input name="atkbonus1" type="text">
                    </td>
                    <td>
                      <input name="atkdamage1" type="text">
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <input name="atkname2" type="text">
                    </td>
                    <td>
                      <input name="atkbonus2" type="text">
                    </td>
                    <td>
                      <input name="atkdamage2" type="text">
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <input name="atkname3" type="text">
                    </td>
                    <td>
                      <input name="atkbonus3" type="text">
                    </td>
                    <td>
                      <input name="atkdamage3" type="text">
                    </td>
                  </tr>
                </tbody>
              </table>
              <textarea></textarea>
            </div>
          </section>
          <section class="equipment">
            <div>
              <label>Equipment</label>
              <div class="money">
                <ul>
                  <li>
                    <label for="cp">cp</label><input name="cp">
                  </li>
                  <li>
                    <label for="sp">sp</label><input name="sp">
                  </li>
                  <li>
                    <label for="ep">ep</label><input name="ep">
                  </li>
                  <li>
                    <label for="gp">gp</label><input name="gp">
                  </li>
                  <li>
                    <label for="pp">pp</label><input name="pp">
                  </li>
                </ul>
              </div>
              <textarea placeholder="Equipment list here"></textarea>
            </div>
          </section>
        </section>
        <section>
          <section class="flavor">
            <div class="personality">
              <label for="personality">Personality</label><textarea name="personality"></textarea>
            </div>
            <div class="ideals">
              <label for="ideals">Ideals</label><textarea name="ideals"></textarea>
            </div>
            <div class="bonds">
              <label for="bonds">Bonds</label><textarea name="bonds"></textarea>
            </div>
            <div class="flaws">
              <label for="flaws">Flaws</label><textarea name="flaws"></textarea>
            </div>
          </section>
          <section class="features">
            <div>
              <label for="features">Features &amp; Traits</label><textarea name="features"></textarea>
            </div>
          </section>
        </section>
      </main>
    </form>

    
    <script src="origins.js"></script>
    <script src="classes.js"></script>
    <script src="index.js"></script>
  </body>
</html>
